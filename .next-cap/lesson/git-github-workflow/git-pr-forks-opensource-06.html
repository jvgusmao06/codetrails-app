doc`), commitar e dar `git push -u origin fix/doc`.\\n4. Abrir um **Pull Request (PR)** no GitHub para os mantenedores revisarem (Code Review) e aprovarem o merge!\",\"codeExample\":\"git clone https://github.com/SEU_USER/projeto.git\\ncd projeto\\ngit remote add upstream https://github.com/ORG/projeto.git\\n\\n# Sincronizar sua main com o projeto original\\ngit fetch upstream\\ngit merge upstream/main\\n\\n# Criar branch para sua contribuição\\ngit switch -c feat/nova-trilha\",\"keyTakeaways\":[\"`origin` aponta para o SEU fork; `upstream` aponta para o repositório ORIGINAL.\",\"Nunca faça alterações direto na `main` do seu fork — crie sempre uma branch dedicada para cada Pull Request.\",\"Mantenha PRs pequenos e focados em um único problema para facilitar o Code Review.\"]},{\"type\":\"order_code\",\"prompt\":\"Ordene os passos corretos para sincronizar sua branch local com o repositório original (`upstream`) e iniciar uma nova contribuição:\",\"blocks\":[\"git switch -c feat/melhoria\",\"git fetch upstream\",\"git merge upstream/main\"],\"correctOrder\":[1,2,0],\"explanation\":\"Primeiro buscamos as novidades do `upstream`, atualizamos nossa `main` com `merge upstream/main`, e só então criamos a nova branch limpa.\"},{\"type\":\"write_code\",\"prompt\":\"Desafio de Código: Adicione o repositório remoto `upstream` apontando para `https://github.com/org/app.git` e envie sua branch `feat/docs` para `origin` com `-u`:\",\"starterCode\":\"# 1. Adicione o remote upstream\\n# 2. Envie feat/docs para origin com -u\\n\",\"requiredTokens\":[\"git remote add\",\"upstream\",\"git push\",\"-u\",\"origin\",\"feat/docs\"],\"sampleSolution\":\"git remote add upstream https://github.com/org/app.git\\ngit push -u origin feat/docs\",\"hint\":\"Use `git remote add upstream https://github.com/org/app.git` e `git push -u origin feat/docs`.\",\"explanation\":\"Com `origin` e `upstream` configurados, você mantém seu fork sempre atualizado com o projeto principal.\"}]}}]}]\n"])</script><
