nças numa 'gaveta' temporária e 'git stash pop' para recuperá-las depois!\",\"codeExample\":\"# Clonar repositório existente\\ngit clone https://github.com/org/projeto.git\\n\\n# Guardar mudanças atuais não-commitadas na gaveta\\ngit stash\\n\\n# Atualizar branch com novidades do servidor remoto\\ngit pull origin main\\n\\n# Recuperar mudanças da gaveta e enviar commits\\ngit stash pop\\ngit push -u origin minha-branch\",\"keyTakeaways\":[\"'origin' é o apelido padrão do servidor remoto (você pode ver com 'git remote -v').\",\"'git pull' equivale a 'git fetch' (buscar dados) + 'git merge' (integrar na branch atual).\",\"'git stash' limpa sua Working Tree guardando o trabalho em andamento numa pilha temporária; 'git stash pop' restaura.\"]},{\"type\":\"multiple_choice\",\"prompt\":\"Você está editando arquivos na branch 'main', ainda não quer fazer commit, mas precisa limpar o diretório de trabalho imediatamente para trocar de branch e corrigir um bug urgente. Qual comando salva suas modificações atuais temporariamente sem fazer commit?\",\"options\":[\"git reset --hard\",\"git stash\",\"git push --force\",\"git rm -rf\"],\"correctIndex\":1,\"explanation\":\"O comando 'git stash' guarda todas as modificações não-commitadas numa pilha segura e deixa o diretório limpo; depois basta rodar 'git stash pop' para trazê-las de volta.\"},{\"type\":\"write_code\",\"prompt\":\"Desafio de Código: Escreva os dois comandos Git para primeiro atualizar sua branch local puxando ('git pull') do remoto 'origin' na branch 'main', e depois enviar ('git push') seus commits para 'origin main':\",\"starterCode\":\"# 1. Puxe as atualizações de origin main\\n# 2. Envie seus commits para origin main\\n\",\"requiredTokens\":[\"git pull\",\"origin\",\"main\",\"git push\"],\"sampleSolution\":\"git pull origin main\\ngit push origin main\",\"hint\":\"Use 'git pull origin main' e na linha seguinte 'git push origin main'.\",\"explanation\":\"Fazer 'git pull origin main' antes de 'git push origin mai
