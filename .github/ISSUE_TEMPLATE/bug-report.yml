name: Reportar Erro em Lição ou no App
description: Encontrou um bug, resposta incorreta ou erro de digitação? Avise aqui.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: location
    attributes:
      label: Onde ocorreu?
      placeholder: "Ex: /lesson/python-basics/py-vars-01 ou página /tracks"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição do problema
      description: O que aconteceu e o que você esperava que acontecesse?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Web (Desktop)
        - Web / PWA (Mobile)
        - Android (Capacitor)
        - iOS (Capacitor)
