t Out)**: O primeiro a entrar é o primeiro a sair (como uma fila de banco ou fila de impressão). Operações: `enqueue` e `dequeue` em $O(1)$.\\n3. **Hash Map (Dicionário / Map)**: Armazena pares `chave -\u003e valor` usando uma função hash para transformar a chave num endereço direto, permitindo buscar, inserir e remover em tempo médio **$O(1)$**!\",\"codeExample\":\"# 1. Pilha (LIFO) em Python\\npilha = []\\npilha.append('A')  # push\\npilha.append('B')  # push\\nultimo = pilha.pop()  # 'B' (Last In, First Out)\\n\\n# 2. Hash Map (dict) -\u003e Busca em O(1)!\\nvistos = {}\\nfor num in [10, 20, 10]:\\n    vistos[num] = vistos.get(num, 0) + 1  # {10: 2, 20: 1}\",\"keyTakeaways\":[\"Pilha (LIFO): último que entra é o primeiro que sai (`Ctrl+Z`, histórico de navegação, Call Stack).\",\"Fila (FIFO): primeiro que entra é o primeiro que sai (filas de mensagens, atendimento, busca em largura BFS).\",\"Hash Map (`dict` em Python, `Map` em JS, `HashMap` em Java/Rust): troca um pouco de memória por buscas instantâneas em $O(1)$!\"]},{\"type\":\"fill_in_blank\",\"prompt\":\"Complete o código Python para empilhar e desempilhar em uma Pilha (LIFO) e inicializar um Dicionário (Hash Map) com busca em O(1):\",\"codeTemplate\":\"pilha = []\\npilha.append(10)\\nultimo = pilha.{{blank}}()\\nfrequencias = {{blank}}\",\"blanks\":[{\"answer\":\"pop\",\"placeholder\":\"desempilhar\"},{\"answer\":\"{}\",\"placeholder\":\"hash map\"}],\"options\":[\"pop\",\"{}\",\"shift\",\"[]\",\"first\",\"()\"],\"explanation\":\"Em Python, '.pop()' remove e retorna o último item da pilha (LIFO) em O(1), e '{}' cria um dicionário (Hash Map) com acesso médio O(1).\"},{\"type\":\"write_code\",\"prompt\":\"Desafio de Código: Usando um dicionário (`vistos = {}`), escreva uma função `tem_duplicata(nums)` que percorra `for n in nums:`, retorne `True` se `n in vistos`, adicione `vistos[n] = True`, e ao final retorne `False`:\",\"starterCode\":\"# Detecte duplicatas em O(n) usando Hash Map:\\n\",\"requiredTokens\":[\"def\",\"tem_duplicata\",\"vistos\",\"for\",\"in\",\"nums\",\"if\",\"return\",\"True\",\"False\"],\"sampleSolution\":\"def tem_duplicata(nums):\\n    vistos = {}\\n    for n in nums:\\n        if n in vistos:\\n            return True\\n        vistos[n] = True\\n    return False\",\"hint\":\"Crie 'vistos = {}', percorra 'for n in nums:', se 'n in vistos:' retorne True; senão 'vistos[n] = True'. No fim, retorne False.\",\"explanation\":\"Em vez de dois loops aninhados O(n²), usar um Hash Map/Set reduz a detecção de duplicatas para uma única passada O(n)!\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#09090b\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"$2\",\"$3\"],\"IconMark\"]\nf:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"CodeTrails — Aprendizado Modular de Programação Open Source\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plataforma open-source de roadmaps e trilhas interativas para linguagens, bibliotecas e frameworks.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CodeTrails\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.117ezoe8m31dk.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"7\",{}]]\n"])</script></body></html>
