spawn(async { 20 });\\n    let (a, b) = tokio::join!(h1, h2);\\n    println!(\\\"{:?} {:?}\\\", a, b);\\n}\",\"keyTakeaways\":[\"Em Rust, `async fn` retorna uma `Future` preguiçosa — precisa de `.await` ou `tokio::spawn` para executar.\",\"NUNCA chame `std::thread::sleep` dentro de uma task Tokio (trava o worker); use `tokio::time::sleep(...)`!\",\"`tokio::spawn` exige que os dados movidos para a task sejam `'static + Send`.\"]},{\"type\":\"multiple_choice\",\"prompt\":\"Qual é o erro grave ao usar `std::thread::sleep` dentro de uma `async fn` rodando no Tokio?\",\"options\":[\"O código não compila\",\"Bloqueia a thread inteira do executor do Tokio, paralisando outras tasks assíncronas compartilhadas naquela thread\",\"Converte o código para Python\",\"Apaga variáveis da Heap\"],\"correctIndex\":1,\"explanation\":\"`std::thread::sleep` trava a thread do sistema operacional; o correto no runtime Tokio é `tokio::time::sleep(...).await`.\"},{\"type\":\"write_code\",\"prompt\":\"Desafio de Código: Escreva uma função `#[tokio::main]` `async fn main()` que lance uma tarefa com `tokio::spawn(async { println!(\\\"ok\\\"); }).await`:\",\"starterCode\":\"// Crie #[tokio::main] async fn main() com tokio::spawn:\\n\",\"requiredTokens\":[\"#[tokio::main]\",\"async fn main()\",\"tokio::spawn\",\".await\"],\"sampleSolution\":\"#[tokio::main]\\nasync fn main() {\\n    let _ = tokio::spawn(async {\\n        println!(\\\"ok\\\");\\n    }).await;\\n}\",\"hint\":\"Coloque `#[tokio::main]` acima de `async fn main()` e chame `tokio::spawn(async { ... }).await`.\",\"explanation\":\"O macro `#[tokio::main]` inicializa automaticamente o runtime multi-thread do Tokio.\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#09090b\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27
