`).\\n- **`Pick\u003cT, 'a' | 'b'\u003e`**: seleciona apenas algumas chaves.\\n- **`Omit\u003cT, 'id'\u003e`**: remove chaves específicas.\\n- **`Record\u003cK, V\u003e`**: cria um dicionário tipado.\",\"codeExample\":\"interface User { id: number; nome: string; senha: string; }\\n\\ntype CriarUser = Omit\u003cUser, \\\"id\\\"\u003e;        // { nome, senha }\\ntype AtualizarUser = Partial\u003cCriarUser\u003e;   // { nome?: string; senha?: string }\\ntype PublicUser = Pick\u003cUser, \\\"id\\\" | \\\"nome\\\"\u003e;\\n\\nfunction formatar(v: string | number) {\\n  return typeof v === \\\"string\\\" ? v.toUpperCase() : v.toFixed(2);\\n}\",\"keyTakeaways\":[\"`typeof`, `instanceof` e `'chave' in obj` fazem o compilador estreitar (narrow) tipos union com segurança.\",\"`Omit\u003cT, 'id'\u003e` e `Pick\u003cT, 'a'\u003e` evitam duplicação de tipos em DTOs de API.\",\"`Partial\u003cT\u003e` é o padrão para funções de `update(id, dados: Partial\u003cUser\u003e)`.\"]},{\"type\":\"fill_in_blank\",\"prompt\":\"Complete os Utility Types para tornar todos os campos de `Produto` opcionais e criar uma versão sem o campo `'id'`:\",\"codeTemplate\":\"type ProdutoPatch = {{blank}}\u003cProduto\u003e;\\ntype NovoProduto = {{blank}}\u003cProduto, \\\"id\\\"\u003e;\",\"blanks\":[{\"answer\":\"Partial\",\"placeholder\":\"opcional\"},{\"answer\":\"Omit\",\"placeholder\":\"remover\"}],\"options\":[\"Partial\",\"Omit\",\"Pick\",\"Record\",\"Readonly\"],\"explanation\":\"`Partial\u003cT\u003e` torna todas as propriedades opcionais e `Omit\u003cT, K\u003e` remove a propriedade K do tipo.\"},{\"type\":\"write_code\",\"prompt\":\"Desafio de Código: Crie um `type UsuarioPublico = Omit\u003cUsuario, \\\"senha\\\"\u003e;` e um `type UsuarioUpdate = Partial\u003cUsuarioPublico\u003e;`:\",\"starterCode\":\"interface Usuario { id: string; nome: string; senha: string; }\\n// Crie UsuarioPublico e UsuarioUpdate:\\n\",\"requiredTokens\":[\"type\",\"UsuarioPublico\",\"Omit\",\"\\\"senha\\\"\",\"UsuarioUpdate\",\"Partial\"],\"sampleSolution\":\"type UsuarioPublico = Omit\u003cUsuario, \\\"senha\\\"\u003e;\\ntype UsuarioUpdate = Partial\u003cUsuarioPublico\u003e;\",\"hint\":\"Use `type UsuarioPublico = Omit\u003cUsuario, \\\"senha\\\"\u003e;` e `type UsuarioUpdate = Partial\u003cUsuarioPublico\u003e;`.\",\"explanation\":\"Combinar `Omit` e `Partial` garante que dados sensíveis como `senha` nunca vazem e que atualizações parciais sejam seguras.\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#09090b\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"$2\",\"$3\"],\"IconMark\"]\nf:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"CodeTrails — Aprendizado Modular de Programação Open Source\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plataforma open-source de roadmaps e trilhas interativas para linguagens, bibliotecas e frameworks.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CodeTrails\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.117ezoe8m31dk.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"7\",{}]]\n"])</script></body></html>
