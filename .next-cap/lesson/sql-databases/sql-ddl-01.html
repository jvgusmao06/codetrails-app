GIN;\\nUPDATE contas SET saldo = saldo - 100 WHERE id = 1;\\nUPDATE contas SET saldo = saldo + 100 WHERE id = 2;\\nCOMMIT;\",\"keyTakeaways\":[\"PRIMARY KEY identifica unicamente cada linha e já cria automaticamente um índice B-Tree.\",\"BEGIN inicia uma transação; COMMIT grava tudo permanentemente e ROLLBACK desfaz tudo em caso de falha.\",\"CREATE INDEX idx_email ON usuarios(email) evita Full Table Scans lentos em buscas frequentes.\"]},{\"type\":\"order_code\",\"prompt\":\"Ordene os comandos SQL para executar uma transferência bancária segura dentro de uma transação atômica:\",\"blocks\":[\"BEGIN;\",\"UPDATE contas SET saldo = saldo - 50 WHERE id = 10;\",\"UPDATE contas SET saldo = saldo + 50 WHERE id = 20;\",\"COMMIT;\"],\"correctOrder\":[0,1,2,3],\"explanation\":\"A transação começa com BEGIN, executa o débito e o crédito com UPDATE e confirma atomicamente ambos com COMMIT.\"},{\"type\":\"fill_in_blank\",\"prompt\":\"Complete o comando SQL para inserir um novo usuário na tabela 'usuarios' e criar um índice na coluna 'email':\",\"codeTemplate\":\"{{blank}} INTO usuarios (nome, email) {{blank}} ('Ana', 'ana@dev.io');\\nCREATE {{blank}} idx_usuarios_email ON usuarios (email);\",\"blanks\":[{\"answer\":\"INSERT\",\"placeholder\":\"comando\"},{\"answer\":\"VALUES\",\"placeholder\":\"valores\"},{\"answer\":\"INDEX\",\"placeholder\":\"estrutura\"}],\"options\":[\"INSERT\",\"VALUES\",\"INDEX\",\"INTO\",\"SET\",\"TABLE\"],\"explanation\":\"INSERT INTO ... VALUES adiciona novos registros e CREATE INDEX cria um índice para acelerar filtros WHERE na coluna.\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#09090b\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"$2\",\"$3\"],\"IconMark\"]\nf:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"CodeTril
