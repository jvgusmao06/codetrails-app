res Unicode (char). Além disso, 'if/else' em Rust retorna valor e pode ser atribuído direto a uma variável!\",\"codeExample\":\"const LIMITE: i32 = 100;\\n\\nfn main() {\\n    let nome: \u0026str = \\\"Ferris\\\";\\n    let mut nivel: i32 = 1;\\n    nivel += 1;\\n\\n    // if/else funcionando como expressão que retorna valor\\n    let status = if nivel \u003e= 2 { \\\"Pronto\\\" } else { \\\"Iniciante\\\" };\\n    println!(\\\"{} ({}) -\u003e {}\\\", nome, LIMITE, status);\\n}\",\"keyTakeaways\":[\"'let x = 5;' cria uma variável imutável; 'let mut x = 5;' cria uma variável mutável.\",\"'const' exige anotação de tipo explícita (ex: const TAXA: f64 = 0.05;) e valor conhecido em compilação.\",\"Em Rust, 'if condicao { valor1 } else { valor2 }' pode ser usado no lado direito de um 'let'!\"]},{\"type\":\"fill_in_blank\",\"prompt\":\"Complete o código Rust declarando uma constante tipada, uma variável mutável e atribuindo o resultado de um if/else:\",\"codeTemplate\":\"{{blank}} MAX_VIDAS: u8 = 5;\\nlet {{blank}} pontos = 10;\\nlet msg = {{blank}} pontos \u003e 5 { \\\"Alto\\\" } else { \\\"Baixo\\\" };\",\"blanks\":[{\"answer\":\"const\",\"placeholder\":\"constante\"},{\"answer\":\"mut\",\"placeholder\":\"mutável\"},{\"answer\":\"if\",\"placeholder\":\"condicional\"}],\"options\":[\"const\",\"mut\",\"if\",\"var\",\"let\",\"when\"],\"explanation\":\"Usamos 'const' para constantes tipadas, 'let mut' para variáveis mutáveis e 'if ... else' como expressão.\"},{\"type\":\"write_code\",\"prompt\":\"Escreva do zero em Rust a declaração de uma variável mutável 'let mut idade: i32 = 20;' e imprima seu valor com 'println!(\\\"{}\\\", idade);':\",\"starterCode\":\"// Declare let mut idade e imprima com println!:\\n\",\"requiredTokens\":[\"let\",\"mut\",\"idade\",\"20\",\"println!\"],\"sampleSolution\":\"let mut idade: i32 = 20;\\nprintln!(\\\"{}\\\", idade);\",\"hint\":\"Use: let mut idade: i32 = 20; na primeira linha e println!(\\\"{}\\\", idade); na segunda.\",\"explanation\":\"A combinação 'let mut' informa ao compilador Rust que a variável terá seu valor alterado ao longo do escopo.\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#09090b\"}]]\n"])</script><script>self.__next_f.push([1,"19:I[27201,[\"$2\",\"$3\"],\"IconMark\"]\nf:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"CodeTrilhas — Aprendizado Modular de Programação Open Source\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plataforma open-source de roadmaps e trilhas interativas para linguagens, bibliotecas e frameworks.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"CodeTrilhas\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.117ezoe8m31dk.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"$L19\",\"7\",{}]]\n"])</script></body></html>
