ava.util.Optional;\\n\\nenum StatusPedido { PAGO, PENDENTE, CANCELADO }\\n\\nOptional\u003cString\u003e email = Optional.ofNullable(buscarEmail());\\nString destino = email.orElse(\\\"sem-email@dominio.com\\\");\\n\\nvar status = StatusPedido.PAGO; // Tipo inferido: StatusPedido\",\"keyTakeaways\":[\"Use `Optional.ofNullable(valor).orElse(padrao)` em vez de `if (x != null)` espalhados pelo código.\",\"`enum` garante em tempo de compilação que apenas valores válidos existam (ex: `StatusPedido.PAGO`).\",\"`var` só funciona em variáveis locais inicializadas (nunca em parâmetros de método ou campos de classe).\"]},{\"type\":\"multiple_choice\",\"prompt\":\"Qual método de `Optional\u003cString\u003e` retorna o valor presente ou um valor padrão alternativo caso esteja vazio, sem lançar exceção?\",\"options\":[\".get()\",\".orElse(\\\"padrao\\\")\",\".isNull()\",\".unwrap()\"],\"correctIndex\":1,\"explanation\":\"`.get()` lança `NoSuchElementException` se estiver vazio; já `.orElse(\\\"padrao\\\")` devolve com segurança o valor alternativo.\"},{\"type\":\"write_code\",\"prompt\":\"Desafio de Código: Crie um `enum Nivel { INICIANTE, INTERMEDIARIO, AVANCADO }` e use `Optional.ofNullable(nome).orElse(\\\"Visitante\\\")` atribuído a `var exibicao`:\",\"starterCode\":\"// Defina enum Nivel e use Optional.ofNullable:\\n\",\"requiredTokens\":[\"enum\",\"Nivel\",\"var\",\"Optional.ofNullable\",\".orElse(\"],\"sampleSolution\":\"enum Nivel { INICIANTE, INTERMEDIARIO, AVANCADO }\\nvar exibicao = Optional.ofNullable(nome).orElse(\\\"Visitante\\\");\",\"hint\":\"Declare `enum Nivel { INICIANTE, INTERMEDIARIO, AVANCADO }` e `var exibicao = Optional.ofNullable(nome).orElse(\\\"Visitante\\\");`.\",\"explanation\":\"`enum` e `Optional` tornam suas regras de negócio explícitas e à prova de valores nulos.\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initi
